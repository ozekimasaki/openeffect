[package]
name = "gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenEffect layer compositor and composition viewer"

[dependencies]
effect-api = { path = "../effect-api" }
eval = { path = "../eval" }
model = { path = "../model" }
serde = { version = "=1.0.213", features = ["derive"] }
serde_json = "=1.0.132"
# wgpu 23 が依存する indexmap の最新版は edition2024 を要求する。Rust 1.83 で解決できる版に固定する。
indexmap = "=2.6.0"
wgpu = "=23.0.1"
