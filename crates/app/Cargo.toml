[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "小さいコンポジションを評価し、CPU 合成を winit の窓に出す"

[dependencies]
effect-api = { path = "../effect-api" }
eval = { path = "../eval" }
gpu = { path = "../gpu" }
io-aep = { path = "../io-aep" }
model = { path = "../model" }
pollster = "=0.3.0"
# wgpu 23 が依存する indexmap の最新版は edition2024 を要求する。Rust 1.83 で解決できる版に固定する。
indexmap = "=2.6.0"
wgpu = "=23.0.1"
# Wayland のシステムライブラリが無い環境でもビルドできるよう、X11 と Windows / macOS の窓だけを有効にする。
winit = { version = "=0.30.5", default-features = false, features = ["rwh_06", "x11"] }
